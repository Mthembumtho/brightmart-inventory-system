{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="card login-box">
  <h1>BrightMart Traders</h1>
  <form method="post">
    <div class="field">
      <label for="username">Username</label>
      <input id="username" name="username" value="{{ username or '' }}" autocomplete="username" autofocus>
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password">
    </div>
    <button class="btn" type="submit" style="width:100%">Login</button>
  </form>
  <p class="muted small" style="text-align:center;margin-top:1rem">
    A default Store Manager account is created at installation.
  </p>
</div>
{% endblock %}
